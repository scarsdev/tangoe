<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VERIFY privacy information.">
  <title>VERIFY</title>
  <style>
    :root { color-scheme: light; --ink: #10211d; --paper: #f7f4e9; --mint: #d9f5e5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(680px, 100%); padding: 40px; border: 1px solid rgba(16,33,29,.1); border-radius: 28px; background: rgba(255,255,255,.72); }
    h1 { margin: 0 0 8px; font-size: clamp(42px, 9vw, 72px); letter-spacing: -.055em; }
    p { margin: 0 0 24px; color: #4e5c57; }
    a { display: inline-block; padding: 12px 18px; border-radius: 999px; background: var(--ink); color: white; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #36bd7e; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>VERIFY</h1>
    <p>Clear work records for owners, teams and customers.</p>
    <a href="./privacy/">Read the Privacy Policy</a>
  </main>
</body>
</html>
